[package]
name = "ublk-vsock"
version = "0.1.0"
edition = "2021"
description = "ublk block device daemon over AF_VSOCK with NBD backend"

[[bin]]
name = "ublk-vsock"
path = "src/main.rs"

[dependencies]
libublk = "0.4"
io-uring = "0.7"
libc = "0.2"
smol = "2.0"
async-channel = "2.0"
futures = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
